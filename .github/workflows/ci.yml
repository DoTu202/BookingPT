name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.10
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      - run: npm audit --omit=dev --audit-level=high

  client:
    name: Mobile app (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm test -- --ci
