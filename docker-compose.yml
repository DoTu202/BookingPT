# Local development stack: API + MongoDB.
#   docker compose up --build
# The API is then available at http://localhost:3001
services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10
      start_period: 20s

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/bookingpt
      # Development-only secret; set a real one in production.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      NODE_ENV: ${NODE_ENV:-development}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
